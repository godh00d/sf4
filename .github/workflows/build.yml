name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Build mod
        shell: powershell
        run: ./gradlew.bat clean build
      - name: Validate achievement catalog
        shell: powershell
        run: ./instance-config/generate_triumph.ps1 -Check
      - name: Check whitespace
        shell: powershell
        run: git diff --check
