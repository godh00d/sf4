plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

group = 'com.example'
version = '1.0.0'
archivesBaseName = 'sf4'

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.fabricmc.net/repository/maven-central/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.93.0+1.20.4'
    include 'net.fabricmc:fabric-mixin-compile-extensions:1.1.0+v1.20.4'
}

loom {
    modId = 'sf4'
    modRefMap = 'sf4.refmap.json'
    accessWidener = 'sf4.accesswidener'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri('build/libs')
        }
    }
}